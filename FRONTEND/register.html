<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
</head>
<body>
  <h1>Registro</h1>
  <form id="registerForm">
    <select name="tipo_documento" required>
      <option value="">Tipo de documento</option>
      <option value="dni">DNI</option>
      <option value="pasaporte">Pasaporte</option>
      <option value="carnet-ext">Carnet de extranjería</option>
    </select>
    <input type="text" name="num_documento" placeholder="Número de documento" required>
    <input type="date" name="fecha_emision" required>
    <input type="password" name="password_create" placeholder="Contraseña" required>
    <label><input type="radio" name="mayor" value="true"> Mayor de edad</label>
    <label><input type="radio" name="menor" value="true"> Menor de edad</label>
    <button type="submit">Registrar</button>
  </form>
  <div id="msg"></div>
  <a href="/">Volver al inicio</a>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        tipo_documento: form.tipo_documento.value,
        num_documento: form.num_documento.value,
        fecha_emision: form.fecha_emision.value,
        password_create: form.password_create.value,
        mayor: form.mayor.checked,
        menor: form.menor.checked
      };
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      document.getElementById('msg').textContent = json.message;
      if(json.ok && json.redirect) window.location = json.redirect;
    });
  </script>
</body>
</html>
